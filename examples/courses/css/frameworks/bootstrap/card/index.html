<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card com Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container py-4">
      <article class="card">
        <div class="card-body">
          <h2 class="card-title">Plano básico</h2>
          <p class="card-text">Resumo do serviço oferecido.</p>
          <a class="btn btn-primary" href="#">Contratar</a>
        </div>
      </article>
    </main>
  </body>
</html>
