<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro de produto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
              <h1 class="h3 mb-1">Cadastro de produto</h1>
              <p class="text-secondary mb-0">Preencha os dados para adicionar um item ao catálogo.</p>
            </div>
            <span class="badge text-bg-primary">Novo</span>
          </div>

          <section class="card shadow-sm">
            <div class="card-body">
              <form>
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="product-name">Nome</label>
                    <input
                      class="form-control"
                      id="product-name"
                      name="product-name"
                      type="text"
                      placeholder="Ex.: Monitor 24 polegadas"
                    />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label" for="product-price">Preço</label>
                    <div class="input-group">
                      <span class="input-group-text">R$</span>
                      <input
                        class="form-control"
                        id="product-price"
                        name="product-price"
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="0,00"
                      />
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label" for="product-category">Categoria</label>
                    <select class="form-select" id="product-category" name="product-category">
                      <option value="">Selecione uma categoria</option>
                      <option value="perifericos">Periféricos</option>
                      <option value="telas">Telas</option>
                      <option value="armazenamento">Armazenamento</option>
                    </select>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label" for="product-code">Código interno</label>
                    <input
                      class="form-control"
                      id="product-code"
                      name="product-code"
                      type="text"
                      placeholder="Ex.: PROD-001"
                    />
                  </div>

                  <div class="col-12">
                    <label class="form-label" for="product-description">Descrição</label>
                    <textarea
                      class="form-control"
                      id="product-description"
                      name="product-description"
                      rows="4"
                      placeholder="Descreva características, marca, modelo ou observações."
                    ></textarea>
                  </div>

                  <div class="col-12">
                    <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
                      <button class="btn btn-outline-secondary" type="reset">Cancelar</button>
                      <button class="btn btn-primary" type="submit">Salvar produto</button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
