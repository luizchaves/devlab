<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Grid responsivo com Tailwind CSS</title>
  </head>
  <body class="bg-stone-100 text-stone-950">
    <main class="mx-auto max-w-5xl px-4 py-8">
      <p class="mb-3 text-sm font-semibold text-stone-700">Sem breakpoint</p>
      <div class="mb-8 grid grid-cols-3 gap-3">
        <div class="rounded-md bg-white p-4 shadow-sm">1</div>
        <div class="rounded-md bg-white p-4 shadow-sm">2</div>
        <div class="rounded-md bg-white p-4 shadow-sm">3</div>
      </div>

      <p class="mb-3 text-sm font-semibold text-stone-700">Mobile first</p>
      <div class="grid grid-cols-1 gap-3 md:grid-cols-3">
        <section class="rounded-md bg-white p-4 shadow-sm">
          <h2 class="font-semibold">Monitoramento</h2>
          <p class="mt-1 text-sm text-stone-600">Acompanha disponibilidade 24/7.</p>
        </section>
        <section class="rounded-md bg-white p-4 shadow-sm">
          <h2 class="font-semibold">Alertas</h2>
          <p class="mt-1 text-sm text-stone-600">Notifica falhas rapidamente.</p>
        </section>
        <section class="rounded-md bg-white p-4 shadow-sm">
          <h2 class="font-semibold">Relatórios</h2>
          <p class="mt-1 text-sm text-stone-600">Mostra histórico de incidentes.</p>
        </section>
      </div>
    </main>
  </body>
</html>
