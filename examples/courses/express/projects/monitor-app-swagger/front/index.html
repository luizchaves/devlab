<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitor App — Hosts monitorados</title>
    <link rel="stylesheet" href="css/tailwind.css" />
  </head>
  <body class="min-h-screen">
    <header class="border border-slate-200 bg-white">
      <div class="mx-auto max-w-7xl px-4 py-3 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2 font-bold text-slate-900">
          <span class="status-dot status-online"></span>
          Monitor App
        </a>
        <nav class="flex items-center gap-4 text-sm font-medium text-slate-600">
          <a href="index.html">Hosts</a>
          <a href="host.html">Histórico</a>
          <a href="signin.html">Entrar</a>
          <a href="signup.html" class="btn btn-primary">Criar conta</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-10">
      <div class="flex items-center justify-between gap-4">
        <div>
          <h1 class="text-3xl font-bold text-slate-900">Hosts monitorados</h1>
          <p class="mt-2 text-sm text-slate-500">
            Cada host é verificado por um <code>ping</code> periódico e guarda o histórico de latência.
          </p>
        </div>
        <span class="text-xs text-slate-500">Atualizado há 30 segundos</span>
      </div>

      <section class="mt-6 grid gap-4 md:grid-cols-3">
        <div class="card metric p-6">
          <p class="text-xs font-semibold text-slate-500">HOSTS CADASTRADOS</p>
          <p id="metric-total" class="mt-2 text-2xl font-bold text-slate-900">0</p>
        </div>
        <div class="card metric p-6">
          <p class="text-xs font-semibold text-slate-500">ONLINE AGORA</p>
          <p id="metric-online" class="mt-2 text-2xl font-bold text-slate-900">0</p>
        </div>
        <div class="card metric p-6">
          <p class="text-xs font-semibold text-slate-500">LATÊNCIA MÉDIA</p>
          <p id="metric-latency" class="mt-2 text-2xl font-bold text-slate-900">—</p>
        </div>
      </section>

      <section id="host-grid" class="mt-8 grid gap-4 md:grid-cols-3"></section>

      <details class="mt-8 card p-6">
        <summary class="font-semibold text-slate-900">Cadastrar novo host</summary>
        <form id="host-form" class="mt-6 grid gap-4 md:grid-cols-2">
          <label class="field">
            <span class="text-sm font-medium text-slate-600">Nome</span>
            <input class="input" name="name" placeholder="Ex.: Google DNS" />
          </label>
          <label class="field">
            <span class="text-sm font-medium text-slate-600">Endereço</span>
            <input class="input" name="address" placeholder="8.8.8.8 ou www.exemplo.com" />
          </label>
          <label class="field md:col-span-2">
            <span class="text-sm font-medium text-slate-600">Tags</span>
            <input class="input" name="tags" placeholder="infra, dns" />
          </label>
          <div class="md:col-span-2">
            <button class="btn btn-primary" type="submit">Cadastrar host</button>
          </div>
        </form>
      </details>
    </main>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
