<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InvestApp | Perfil</title>
    <link rel="stylesheet" href="css/tailwind.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="shell nav-bar">
        <a class="brand" href="/home.html">
          <span class="brand-mark">IA</span>
          InvestApp
        </a>
        <nav class="nav-links" aria-label="Navegação principal">
          <a href="/home.html">Investimento</a>
          <a href="/profile.html">Perfil</a>
        </nav>
        <div class="user-menu">
          <span id="user-name" class="muted"></span>
          <img
            id="dropdown-avatar"
            class="avatar"
            src="/imgs/profile/avatar.png"
            alt="Foto de Perfil"
          />
          <button class="btn btn-soft" type="button" onclick="signout()">Sair</button>
        </div>
      </div>
    </header>

    <main class="shell page">
      <section class="page-grid">
        <div class="card panel">
          <span class="badge">Perfil</span>
          <h1 class="title">Perfil</h1>
          <p class="subtitle">Confira os dados da conta e atualize o avatar do usuário.</p>

          <div style="margin-top: 2rem">
            <img
              src="/imgs/profile/avatar.png"
              alt="Foto de Perfil"
              class="profile-image"
              id="profile-image"
            />
          </div>

          <div class="form-grid" style="margin-top: 2rem">
            <div>
              <span class="label">Nome</span>
              <p id="profile-name"></p>
            </div>
            <div>
              <span class="label">Email</span>
              <p id="profile-email"></p>
            </div>
          </div>
        </div>

        <form class="card panel form-grid" enctype="multipart/form-data">
          <div>
            <span class="eyebrow">Avatar</span>
            <h2>Carregar Imagem</h2>
            <p class="muted">Envie uma imagem para substituir o avatar atual.</p>
          </div>
          <input type="hidden" id="userId" name="userId" />
          <label class="file-drop" for="image">
            <span class="label">Selecionar arquivo</span>
            <input type="file" id="image" name="image" required />
          </label>
          <button type="submit" class="btn btn-primary">Carregar</button>
        </form>
      </section>
    </main>

    <script src="./js/profile.js" type="module"></script>
  </body>
</html>
