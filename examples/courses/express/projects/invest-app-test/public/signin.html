<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InvestApp | Entrar</title>
    <link rel="stylesheet" href="css/tailwind.css" />
  </head>

  <body>
    <main class="auth-page">
      <section class="card auth-card">
        <a class="brand" href="/signin.html">
          <span class="brand-mark">IA</span>
          InvestApp
        </a>
        <span class="badge" style="margin-top: 1.5rem">Acesso</span>
        <h1 class="title">Entrar</h1>
        <p class="subtitle">Acesse sua carteira para cadastrar e acompanhar investimentos.</p>

        <form class="form-grid" onsubmit="handleSubmit(event)" novalidate>
          <label class="field" for="email">
            <span class="label">Email</span>
            <input class="input" type="email" id="email" name="email" required />
            <span class="invalid-feedback">Informe o email do usuário.</span>
          </label>
          <label class="field" for="password">
            <span class="label">Senha</span>
            <input
              class="input"
              type="password"
              id="password"
              name="password"
              minlength="8"
              required
            />
            <span class="invalid-feedback">Informe a senha com 8 caracteres.</span>
          </label>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <p class="muted">
          Ainda não tem conta? <a href="/signup.html"><strong>Cadastrar</strong></a>
        </p>
      </section>
    </main>

    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <strong></strong>
    </div>

    <script src="js/signin.js" type="module"></script>
  </body>
</html>
