services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/dev.db
      # Em producao isto vem de um gerenciador de segredos, nunca do compose.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no ambiente}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      # O banco e os uploads sobrevivem ao contêiner.
      - task-api-data:/data
      - task-api-uploads:/app/uploads

volumes:
  task-api-data:
  task-api-uploads:
