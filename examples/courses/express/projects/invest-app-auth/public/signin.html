<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InvestApp | Entrar</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body>
    <main class="grid min-h-screen place-items-center px-4 py-8">
      <section class="card w-full max-w-lg p-6">
        <a class="flex w-fit items-center gap-3 font-extrabold text-slate-900" href="/signin.html">
          <span
            class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-teal-600 text-white"
          >
            IA
          </span>
          InvestApp
        </a>
        <span class="badge mt-6">Acesso</span>
        <h1 class="mt-3 text-4xl font-extrabold leading-tight">Entrar</h1>
        <p class="mt-3 text-slate-500">Acesse sua carteira para cadastrar e acompanhar investimentos.</p>

        <form class="mt-6 grid gap-4" onsubmit="handleSubmit(event)">
          <label class="field" for="email">
            <span class="text-sm font-bold">Email</span>
            <input
              class="input"
              type="email"
              id="email"
              name="email"
              placeholder="admin@email.com"
              required
            />
          </label>
          <label class="field" for="password">
            <span class="text-sm font-bold">Senha</span>
            <input
              class="input"
              type="password"
              id="password"
              name="password"
              minlength="8"
              placeholder="********"
              required
            />
          </label>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <p class="mt-6 text-sm text-slate-500">Ainda não tem conta? <a class="font-bold text-slate-900" href="/signup.html">Cadastrar</a></p>
      </section>
    </main>

    <script src="js/signin.js" type="module"></script>
  </body>
</html>
