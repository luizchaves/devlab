<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InvestApp | Cadastro</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body>
    <main class="grid min-h-screen place-items-center px-4 py-8">
      <section class="card w-full max-w-lg p-6">
        <a class="flex w-fit items-center gap-3 font-extrabold text-slate-900" href="/signin.html">
          <span
            class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-teal-600 text-white"
          >
            IA
          </span>
          InvestApp
        </a>
        <span class="badge mt-6">Nova conta</span>
        <h1 class="mt-3 text-4xl font-extrabold leading-tight">Cadastro de Usuário</h1>
        <p class="mt-3 text-slate-500">Crie sua conta para organizar investimentos por objetivo.</p>

        <form class="mt-6 grid gap-4">
          <label class="field" for="name">
            <span class="text-sm font-bold">Nome</span>
            <input
              class="input"
              type="text"
              id="name"
              name="name"
              placeholder="Maria Souza"
              required
            />
          </label>
          <label class="field" for="email">
            <span class="text-sm font-bold">Email</span>
            <input
              class="input"
              type="email"
              id="email"
              name="email"
              placeholder="maria@email.com"
              required
            />
          </label>
          <label class="field" for="password">
            <span class="text-sm font-bold">Senha</span>
            <input
              class="input"
              type="password"
              id="password"
              name="password"
              minlength="8"
              placeholder="********"
              required
            />
          </label>
          <label class="field" for="confirmationPassword">
            <span class="text-sm font-bold">Confirmar Senha</span>
            <input
              class="input"
              type="password"
              id="confirmationPassword"
              name="confirmationPassword"
              placeholder="********"
              required
            />
          </label>
          <button type="button" class="btn btn-primary">Cadastrar</button>
        </form>

        <p class="mt-6 text-sm text-slate-500">Já tem conta? <a class="font-bold text-slate-900" href="/signin.html">Entrar</a></p>
      </section>
    </main>

  </body>
</html>
