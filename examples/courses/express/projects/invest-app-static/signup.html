<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvestApp | Criar conta</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <main class="min-h-screen grid items-center px-4 py-10">
      <section class="mx-auto max-w-md card p-6">
        <a class="flex items-center gap-3 font-bold text-slate-900" href="index.html">
          <span class="rounded bg-teal-600 px-3 py-2 text-white">IA</span>
          InvestApp
        </a>
        <h1 class="mt-8 text-3xl">Criar conta</h1>
        <p class="mt-2 text-sm text-slate-500">
          Comece com um cadastro simples. A validação e o envio de e-mail entram nas etapas
          seguintes.
        </p>

        <form class="mt-6 grid gap-4">
          <label class="field">
            <span class="text-sm font-semibold">Nome</span>
            <input class="input" type="text" name="name" placeholder="Maria Souza" />
          </label>
          <label class="field">
            <span class="text-sm font-semibold">E-mail</span>
            <input class="input" type="email" name="email" placeholder="maria@email.com" />
          </label>
          <label class="field">
            <span class="text-sm font-semibold">Senha</span>
            <input class="input" type="password" name="password" placeholder="********" />
          </label>
          <label class="field">
            <span class="text-sm font-semibold">Confirmar senha</span>
            <input
              class="input"
              type="password"
              name="confirmationPassword"
              placeholder="********"
            />
          </label>
          <button class="btn btn-primary" type="button">Cadastrar</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-500">
          Já tem conta? <a class="font-semibold text-slate-900" href="signin.html">Entrar</a>
        </p>
      </section>
    </main>
  </body>
</html>
