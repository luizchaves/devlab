<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dialog API</title>
    <style>
      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
        margin: 0 0.5rem 0.5rem 0;
      }

      .demo-section {
        margin-block: 1rem;
        padding: 1rem;
        border: 1px solid #ddd;
        border-radius: 10px;
      }

      .demo-section h2 {
        margin-top: 0;
        font-size: 1.2rem;
      }

      .demo-section p {
        color: #555;
        margin-bottom: 0.75rem;
      }

      dialog {
        border: none;
        border-radius: 12px;
        padding: 2rem;
        max-width: 400px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }

      dialog h2 {
        margin-top: 0;
      }

      dialog form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      dialog input {
        padding: 0.5rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      dialog .actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      #result {
        margin-top: 1rem;
        padding: 0.5rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Dialog API</h1>

    <section class="demo-section" aria-labelledby="native-title">
      <h2 id="native-title">Diálogos nativos bloqueantes</h2>
      <p>Use os botões para observar como cada método pausa a página até a resposta.</p>
      <button type="button" id="nativeAlertBtn">Testar alert()</button>
      <button type="button" id="nativeConfirmBtn">Testar confirm()</button>
      <button type="button" id="nativePromptBtn">Testar prompt()</button>
    </section>

    <section class="demo-section" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Dialog API com &lt;dialog&gt;</h2>
      <button type="button" id="openBtn">Abrir Modal</button>
      <button type="button" id="alertBtn">Abrir Alerta</button>
    </section>

    <p id="result"></p>

    <!-- Modal com formulário -->
    <dialog id="modal">
      <h2>Qual é o seu nome?</h2>
      <form method="dialog">
        <input id="nameInput" type="text" placeholder="Digite seu nome..." />
        <div class="actions">
          <button type="submit" value="cancel">Cancelar</button>
          <button type="submit" value="confirm">Confirmar</button>
        </div>
      </form>
    </dialog>

    <!-- Alerta simples -->
    <dialog id="alert">
      <h2>Aviso</h2>
      <p>Este é um alerta usando a Dialog API nativa do navegador.</p>
      <div class="actions">
        <button type="button" id="closeAlert">Fechar</button>
      </div>
    </dialog>

    <script>
      const openBtn = document.querySelector('#openBtn');
      const alertBtn = document.querySelector('#alertBtn');
      const nativeAlertBtn = document.querySelector('#nativeAlertBtn');
      const nativeConfirmBtn = document.querySelector('#nativeConfirmBtn');
      const nativePromptBtn = document.querySelector('#nativePromptBtn');
      const modal = document.querySelector('#modal');
      const alert = document.querySelector('#alert');
      const closeAlert = document.querySelector('#closeAlert');
      const nameInput = document.querySelector('#nameInput');
      const result = document.querySelector('#result');

      nativeAlertBtn.addEventListener('click', () => {
        window.alert('Operação realizada com sucesso!');
        result.textContent = 'O alert() bloqueou a página até você fechar a mensagem.';
        result.style.color = '#34495e';
      });

      nativeConfirmBtn.addEventListener('click', () => {
        const confirmed = window.confirm('Deseja realmente excluir este registro?');
        result.textContent = confirmed
          ? 'confirm() retornou true: usuário confirmou.'
          : 'confirm() retornou false: usuário cancelou.';
        result.style.color = confirmed ? '#2ecc71' : '#e74c3c';
      });

      nativePromptBtn.addEventListener('click', () => {
        const name = window.prompt('Qual é o seu nome?');
        result.textContent = name
          ? `prompt() retornou "${name}".`
          : 'prompt() retornou null ou texto vazio.';
        result.style.color = name ? '#2ecc71' : '#e74c3c';
      });

      openBtn.addEventListener('click', () => {
        nameInput.value = '';
        modal.showModal();
      });

      modal.addEventListener('close', () => {
        if (modal.returnValue === 'confirm' && nameInput.value.trim()) {
          result.textContent = `Olá, ${nameInput.value.trim()}!`;
          result.style.color = '#2ecc71';
        } else {
          result.textContent = 'Ação cancelada.';
          result.style.color = '#e74c3c';
        }
      });

      alertBtn.addEventListener('click', () => {
        alert.showModal();
      });

      closeAlert.addEventListener('click', () => {
        alert.close();
      });
    </script>
  </body>
</html>
