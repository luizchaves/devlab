<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaDevices API</title>
    <style>
      video {
        width: 100%;
        max-width: 480px;
        background: #111;
        border-radius: 8px;
        display: block;
        margin-top: 0.75rem;
      }

      img {
        width: 100%;
        max-width: 480px;
        border-radius: 8px;
        display: block;
        margin-top: 0.75rem;
        border: 2px solid #2563eb;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #ccc;
        background: #f4f4f5;
      }

      button:hover {
        background: #e4e4e7;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #status {
        margin-top: 0.75rem;
        font-weight: bold;
        min-height: 1.5rem;
      }
    </style>
  </head>
  <body>
    <h1>MediaDevices API: Captura de Vídeo e Áudio</h1>

    <div class="controls">
      <button type="button" id="startBtn">Iniciar Câmera</button>
      <button type="button" id="snapBtn" disabled>Tirar Foto</button>
      <button type="button" id="stopBtn" disabled>Parar Câmera</button>
    </div>

    <p id="status"></p>

    <video id="videoPreview" autoplay playsinline muted></video>
    <canvas id="snapshotCanvas" style="display: none"></canvas>
    <img id="photoResult" alt="Foto capturada" style="display: none" />

    <script>
      const startBtn = document.querySelector('#startBtn');
      const snapBtn = document.querySelector('#snapBtn');
      const stopBtn = document.querySelector('#stopBtn');
      const video = document.querySelector('#videoPreview');
      const canvas = document.querySelector('#snapshotCanvas');
      const photo = document.querySelector('#photoResult');
      const status = document.querySelector('#status');

      let currentStream = null;

      function updateStatus(text, color = '#333') {
        status.textContent = text;
        status.style.color = color;
      }

      startBtn.addEventListener('click', async () => {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          updateStatus('API getUserMedia não suportada neste navegador.', '#e74c3c');
          return;
        }

        updateStatus('Solicitando permissão de câmera...');

        try {
          const constraints = {
            video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
            audio: false,
          };

          currentStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = currentStream;

          startBtn.disabled = true;
          snapBtn.disabled = false;
          stopBtn.disabled = false;

          updateStatus('Câmera ativa.', '#16a34a');
        } catch (error) {
          const errors = {
            NotAllowedError: 'Permissão de acesso à câmera negada pelo usuário.',
            NotFoundError: 'Nenhum dispositivo de câmera encontrado.',
            NotReadableError: 'A câmera já está em uso por outro aplicativo.',
            OverconstrainedError: 'As restrições de resolução solicitadas não são suportadas.',
          };

          updateStatus(errors[error.name] || `Erro ao acessar câmera: ${error.message}`, '#e74c3c');
        }
      });

      snapBtn.addEventListener('click', () => {
        if (!currentStream || !video.videoWidth) {
          updateStatus('Vídeo não pronto para captura.', '#e74c3c');
          return;
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        photo.src = canvas.toDataURL('image/png');
        photo.style.display = 'block';

        updateStatus('Foto capturada com sucesso!', '#2563eb');
      });

      stopBtn.addEventListener('click', () => {
        if (!currentStream) return;

        currentStream.getTracks().forEach((track) => track.stop());
        video.srcObject = null;
        currentStream = null;

        startBtn.disabled = false;
        snapBtn.disabled = true;
        stopBtn.disabled = true;

        updateStatus('Câmera desligada.', '#71717a');
      });
    </script>
  </body>
</html>
