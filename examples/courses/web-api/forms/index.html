<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários e validação nativa</title>
    <style>
      /* Só estrutura e estados: as cores vêm do tema do navegador. */
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1.5rem;
        max-width: 32rem;
      }

      h1 {
        font-size: 1.1rem;
        margin: 0 0 1rem;
      }

      label {
        display: block;
        margin-bottom: 0.9rem;
        font-size: 0.85rem;
      }

      input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 0.4rem 0.5rem;
        margin-top: 0.2rem;
      }

      /* :user-invalid só marca o campo depois que o usuário interagiu com ele,
         ao contrário de :invalid, que marcaria o formulário inteiro de saída. */
      input:user-invalid {
        outline: 2px solid currentColor;
      }

      .erro {
        font-size: 0.75rem;
        min-height: 1.1em;
        display: block;
      }

      button {
        padding: 0.45rem 1rem;
        cursor: pointer;
      }

      #resultado {
        font-size: 0.85rem;
        border-top: 1px solid currentColor;
        margin-top: 1rem;
        padding-top: 0.5rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Cadastro</h1>

    <!-- #region markup -->
    <!-- As regras de validação são declaradas aqui, não no JavaScript. O novalidate
         desliga apenas o balão nativo, mantendo checkValidity() e :user-invalid. -->
    <form id="form" novalidate>
      <label>
        Nome completo
        <input name="name" required minlength="3" autocomplete="name" />
        <span class="erro" data-erro-de="name"></span>
      </label>

      <label>
        E-mail
        <input name="email" type="email" required autocomplete="email" />
        <span class="erro" data-erro-de="email"></span>
      </label>

      <label>
        Telefone (00) 00000-0000
        <input name="phone" pattern="\(\d{2}\) \d{5}-\d{4}" inputmode="tel" />
        <span class="erro" data-erro-de="phone"></span>
      </label>

      <label>
        Senha
        <input name="password" type="password" required minlength="8" />
        <span class="erro" data-erro-de="password"></span>
      </label>

      <label>
        Confirme a senha
        <input name="confirm" type="password" required />
        <span class="erro" data-erro-de="confirm"></span>
      </label>

      <button type="submit">Cadastrar</button>
    </form>
    <!-- #endregion markup -->

    <p id="resultado"></p>

    <script type="module">
      const form = document.querySelector('#form');
      const resultado = document.querySelector('#resultado');

      // #region custom
      // Regra que o HTML não expressa: os dois campos de senha precisam coincidir.
      // setCustomValidity alimenta o mecanismo nativo em vez de substituí-lo, então
      // checkValidity() e :user-invalid passam a considerar essa regra também.
      const password = form.elements.password;
      const confirm = form.elements.confirm;

      function conferirSenhas() {
        const divergem = confirm.value !== '' && confirm.value !== password.value;
        confirm.setCustomValidity(divergem ? 'As senhas não coincidem.' : '');
      }

      password.addEventListener('input', conferirSenhas);
      confirm.addEventListener('input', conferirSenhas);
      // #endregion custom

      // #region messages
      // A mensagem exibida é a que o navegador já traduziu para o idioma do usuário.
      // O campo validity diz qual restrição falhou, o que permite personalizar só
      // onde a mensagem padrão não serve.
      function mostrarErro(campo) {
        const alvo = form.querySelector(`[data-erro-de="${campo.name}"]`);

        if (campo.validity.valid) {
          alvo.textContent = '';
          return;
        }

        alvo.textContent = campo.validity.patternMismatch
          ? 'Use o formato (00) 00000-0000.'
          : campo.validationMessage;
      }

      for (const campo of form.elements) {
        if (campo.name) campo.addEventListener('blur', () => mostrarErro(campo));
      }
      // #endregion messages

      // #region submit
      // O envio pergunta uma vez se o formulário é válido. Sendo, FormData lê todos
      // os campos pelo atributo name, sem um querySelector por campo.
      form.addEventListener('submit', (event) => {
        event.preventDefault();

        if (!form.checkValidity()) {
          for (const campo of form.elements) {
            if (campo.name) mostrarErro(campo);
          }

          form.querySelector(':invalid').focus();
          resultado.textContent = 'Corrija os campos destacados.';
          return;
        }

        const dados = Object.fromEntries(new FormData(form));
        delete dados.confirm;

        resultado.textContent = `Enviaria para a API:\n${JSON.stringify(dados, null, 2)}`;
        form.reset();
      });
      // #endregion submit
    </script>
  </body>
</html>
