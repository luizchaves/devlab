# Netlify lê este arquivo na raiz do projeto e dispensa configuração pelo painel.

[build]
  command = "npm run build"
  publish = "dist"

# Sem esta regra, recarregar uma rota interna de uma SPA devolve 404:
# o servidor procura um arquivo que não existe. O status 200 preserva a URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
