services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      # O caminho fica dentro de /app porque o diretorio precisa pertencer ao
      # usuario `app`: um volume montado sobre um caminho root-owned continua
      # root-owned, e o SQLite nao consegue criar o arquivo.
      DATABASE_URL: file:/app/data/dev.db
      # Em producao isto vem de um gerenciador de segredos, nunca do compose.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no ambiente}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      # O banco e os uploads sobrevivem ao contêiner.
      - task-api-data:/app/data
      - task-api-uploads:/app/uploads
    # As migrations sao aplicadas antes de o servidor subir: um contêiner novo
    # em um volume vazio se vira sozinho.
    # `pnpm` nao existe no estagio de runtime — o binario do Prisma vem do
    # node_modules copiado do build.
    command: sh -c "./node_modules/.bin/prisma migrate deploy && node src/server.ts"

volumes:
  task-api-data:
  task-api-uploads:
