<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitor App — Histórico do host</title>
    <link rel="stylesheet" href="css/tailwind.css" />
  </head>
  <body class="min-h-screen">
    <header class="border border-slate-200 bg-white">
      <div class="mx-auto max-w-7xl px-4 py-3 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2 font-bold text-slate-900">
          <span class="status-dot status-online"></span>
          Monitor App
        </a>
        <nav class="flex items-center gap-4 text-sm font-medium text-slate-600">
          <a href="index.html">Hosts</a>
          <a href="host.html">Histórico</a>
          <button class="btn btn-soft" type="button" id="signout">Sair</button>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-10">
      <a href="index.html" class="text-sm text-slate-500">&larr; Voltar para os hosts</a>

      <div class="mt-4 flex items-center justify-between gap-4">
        <div>
          <h1 class="text-3xl font-bold text-slate-900" id="host-name">—</h1>
          <p class="mt-2 text-sm text-slate-500" id="host-address">—</p>
        </div>
        <div class="flex items-center gap-4">
          <span class="flex items-center gap-2 text-sm font-semibold text-slate-900">
            <span class="status-dot" id="host-status"></span>
            <span id="host-status-label">—</span>
          </span>
          <button class="btn btn-primary" type="button" id="check-now">Medir agora</button>
        </div>
      </div>

      <section class="mt-6 grid gap-4 md:grid-cols-3">
        <div class="card metric p-6">
          <p class="text-xs font-semibold text-slate-500">ÚLTIMA LATÊNCIA</p>
          <p class="mt-2 text-2xl font-bold text-slate-900" id="metric-last">—</p>
        </div>
        <div class="card metric p-6">
          <p class="text-xs font-semibold text-slate-500">MÉDIA (24 H)</p>
          <p class="mt-2 text-2xl font-bold text-slate-900" id="metric-average">—</p>
        </div>
        <div class="card metric p-6">
          <p class="text-xs font-semibold text-slate-500">DISPONIBILIDADE</p>
          <p class="mt-2 text-2xl font-bold text-slate-900" id="metric-uptime">—</p>
        </div>
      </section>

      <section class="mt-8 card p-6">
        <h2 class="font-semibold text-slate-900">Latência das últimas medições</h2>
        <svg class="mt-4 sparkline" viewBox="0 0 300 80" preserveAspectRatio="none" role="img"
          aria-label="Gráfico de latência das últimas oito medições">
          <path id="latency-line" d="" />
        </svg>
      </section>

      <section class="mt-8 card p-6">
        <h2 class="font-semibold text-slate-900">Histórico de pings</h2>
        <table class="mt-4 table">
          <thead>
            <tr>
              <th>Momento</th>
              <th>Resultado</th>
              <th>Latência</th>
            </tr>
          </thead>
          <tbody id="ping-rows"></tbody>
        </table>
      </section>
    </main>

    <script type="module" src="js/host.js"></script>
  </body>
</html>
