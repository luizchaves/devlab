<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InvestApp | Perfil</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="border-b border-slate-200 bg-white/90">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-5">
        <a class="inline-flex items-center gap-3 font-extrabold text-slate-900" href="/home.html">
          <span
            class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-teal-600 text-white"
          >
            IA
          </span>
          InvestApp
        </a>
        <nav class="flex items-center gap-4 text-sm font-bold text-slate-500" aria-label="Navegação principal">
          <a href="/home.html">Investimento</a>
          <a href="/profile.html">Perfil</a>
        </nav>
        <div class="flex items-center gap-4">
          <span id="user-name" class="text-sm text-slate-500"></span>
          <button class="btn btn-soft" type="button" onclick="signout()">Sair</button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 pt-10 pb-20">
      <section class="grid gap-6 md:grid-cols-[minmax(0,1.2fr)_minmax(18rem,0.8fr)]">
        <div class="card p-6">
          <span class="badge">Perfil</span>
          <h1 class="mt-3 text-4xl font-extrabold leading-tight">Perfil</h1>
          <p class="mt-3 text-slate-500">Confira os dados da conta e atualize o avatar do usuário.</p>

          <div class="mt-8">
            <img src="/imgs/profile/avatar.png" alt="Foto de Perfil" class="profile-image" />
          </div>

          <div class="mt-8 grid gap-4">
            <div>
              <span class="text-sm font-bold">Nome</span>
              <p>Maria Souza</p>
            </div>
            <div>
              <span class="text-sm font-bold">Email</span>
              <p>maria@email.com</p>
            </div>
          </div>
        </div>

        <form class="card grid gap-4 p-6" enctype="multipart/form-data">
          <div>
            <span class="text-xs font-extrabold text-slate-500 uppercase">Avatar</span>
            <h2 class="text-2xl font-extrabold">Carregar Imagem</h2>
            <p class="mt-2 text-slate-500">O envio do arquivo entra na etapa 11, com o Multer. Aqui o campo é só a tela.</p>
          </div>
          <label class="file-drop" for="image">
            <span class="text-sm font-bold">Selecionar arquivo</span>
            <input type="file" id="image" name="image" required />
          </label>
          <button type="button" class="btn btn-primary">Carregar</button>
        </form>
      </section>
    </main>
  </body>
</html>
