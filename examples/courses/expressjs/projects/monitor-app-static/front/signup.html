<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitor App — Criar conta</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body class="min-h-screen">
    <main class="mx-auto max-w-md px-4 py-10">
      <div class="card p-6">
        <div class="flex items-center gap-2 font-bold text-slate-900">
          <span class="status-dot status-online"></span>
          Monitor App
        </div>
        <h1 class="mt-4 text-2xl font-bold text-slate-900">Criar conta</h1>
        <p class="mt-2 text-sm text-slate-500">
          Cada conta enxerga apenas os próprios hosts monitorados.
        </p>

        <form class="mt-6 grid gap-4">
          <label class="field">
            <span class="text-sm font-medium text-slate-600">Nome</span>
            <input class="input" name="name" placeholder="Seu nome" />
          </label>
          <label class="field">
            <span class="text-sm font-medium text-slate-600">E-mail</span>
            <input class="input" type="email" name="email" placeholder="voce@exemplo.com" />
          </label>
          <label class="field">
            <span class="text-sm font-medium text-slate-600">Senha</span>
            <input class="input" type="password" name="password" placeholder="mínimo de 8 caracteres" />
          </label>
          <label class="field">
            <span class="text-sm font-medium text-slate-600">Confirmar senha</span>
            <input class="input" type="password" name="confirmationPassword" placeholder="repita a senha" />
          </label>
          <button class="btn btn-primary" type="button">Criar conta</button>
        </form>

        <p class="mt-6 text-sm text-slate-500">
          Já tem conta? <a href="signin.html" class="font-semibold text-slate-900">Entrar</a>
        </p>
      </div>
    </main>
  </body>
</html>
