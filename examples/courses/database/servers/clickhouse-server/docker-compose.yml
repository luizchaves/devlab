services:

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:24.3-alpine
    restart: always
    environment:
      - CLICKHOUSE_DB=invest_olap
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse123
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    networks:
      - app-tier
    ports:
      - 8123:8123 # HTTP interface / Web client
      - 9000:9000 # Native TCP protocol (clickhouse-client)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./invest.sql:/docker-entrypoint-initdb.d/invest.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:

networks:
  app-tier:
    driver: bridge
