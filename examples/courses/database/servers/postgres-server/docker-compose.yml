services:

  postgres:
    container_name: postgres
    image: postgres:16.2
    restart: always
    environment:
      # POSTGRES_USER: postgres # default
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app-tier
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./data:/var/lib/postgresql/data

  adminer:
    image: adminer:4.8.1
    restart: always
    networks:
      - app-tier
    ports:
      - 8080:8080
    depends_on:
      - postgres

  # O pgAdmin so sobe quando o perfil e pedido: docker compose --profile pgadmin up -d
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:8.3
    restart: always
    profiles:
      - pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - app-tier
    ports:
      - 5050:80
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  app-tier:
    driver: bridge
