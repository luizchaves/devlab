services:
  immudb:
    image: codenotary/immudb:latest
    container_name: immudb-server
    restart: unless-stopped
    ports:
      - "3322:3322"
      - "9497:9497"
    environment:
      - IMMUDB_DIR=/var/lib/immudb
      - IMMUDB_ADMIN_PASSWORD=immudb
    volumes:
      - immudb_data:/var/lib/immudb

volumes:
  immudb_data:
