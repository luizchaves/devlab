<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Tabela</title>
  </head>
  <body>
    <h1>Linguagens mais usadas</h1>

    <!-- CSS: border-collapse: collapse une as bordas da tabela. -->
    <table border="1">
      <caption>
        Percentual de uso declarado pelos alunos
      </caption>
      <thead>
        <tr>
          <th scope="col">Linguagem</th>
          <th scope="col">Utilização</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">JavaScript</th>
          <td>62%</td>
        </tr>
        <tr>
          <th scope="row">Python</th>
          <td>51%</td>
        </tr>
        <tr>
          <th scope="row">Java</th>
          <td>33%</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
