<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Imagens</title>
  </head>
  <body>
    <h1>Imagens</h1>

    <!-- Caminho relativo: img/ está ao lado deste arquivo. -->
    <img src="img/logo.svg" alt="Logotipo azul com a palavra HTML" width="160" height="90" />

    <!-- Imagem ausente: o alt descreve o que deveria aparecer. -->
    <img src="imgs/none.png" alt="Imagem de exemplo não encontrada" width="160" height="90" />

    <figure>
      <img src="img/logo.svg" alt="" width="160" height="90" />
      <figcaption>
        Quando a imagem é decorativa e já explicada pela legenda, o
        <code>alt</code> fica vazio.
      </figcaption>
    </figure>
  </body>
</html>
