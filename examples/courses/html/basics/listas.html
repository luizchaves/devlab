<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Listas</title>
  </head>
  <body>
    <h1>Listas</h1>

    <h2>Não ordenada</h2>
    <!-- Unordered List - UL -->
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>

    <h2>Ordenada</h2>
    <!-- Ordered List - OL -->
    <ol>
      <li>Escrever o HTML</li>
      <li>Abrir no navegador</li>
      <li>Validar a marcação</li>
    </ol>

    <h2>De descrição</h2>
    <!-- Description List - DL -->
    <dl>
      <dt>HTML</dt>
      <dd>Estrutura do conteúdo.</dd>
      <dt>CSS</dt>
      <dd>Apresentação visual.</dd>
    </dl>
  </body>
</html>
