<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview do mapa com Leaflet</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQZt16h+qkEDd7X7pD3Pp+3J8h+Qn+I="
      crossorigin=""
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .map-panel {
        width: min(100%, 960px);
        display: grid;
        grid-template-columns: minmax(16rem, 0.85fr) minmax(22rem, 1.4fr);
        gap: 1rem;
        align-items: stretch;
      }

      .map-copy {
        padding: 1.25rem;
        border: 1px solid #d9e2ef;
        border-radius: 8px;
        background: #ffffff;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #2563eb;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.75rem;
        line-height: 1.15;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      #map {
        min-height: 28rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }

      @media (max-width: 760px) {
        .app-shell {
          padding: 1rem;
        }

        .map-panel {
          grid-template-columns: 1fr;
        }

        #map {
          min-height: 22rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="map-panel" aria-labelledby="map-title">
        <div class="map-copy">
          <p class="eyebrow">DevLab Maps</p>
          <h1 id="map-title">Roteiro pelo centro de João Pessoa</h1>
          <p>
            O mapa combina camada de tiles, marcador, rota e popup para mostrar os elementos
            básicos de uma integração com Leaflet.
          </p>
        </div>

        <div id="map" aria-label="Mapa interativo do centro de João Pessoa"></div>
      </section>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const joaoPessoa = [-7.1195, -34.845];
      const route = [
        [-7.1154, -34.8641],
        [-7.1212, -34.8524],
        [-7.1195, -34.845],
        [-7.1135, -34.8369],
      ];

      const map = L.map('map').setView(joaoPessoa, 13);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);

      L.marker(joaoPessoa)
        .addTo(map)
        .bindPopup('Centro de João Pessoa: ponto central do roteiro.')
        .openPopup();

      L.polyline(route, {
        color: '#2563eb',
        weight: 5,
        opacity: 0.85,
      }).addTo(map);

      map.fitBounds(route, { padding: [32, 32] });
    </script>
  </body>
</html>
