<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvestBaaS - Entrar na Conta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-sm">
    <div class="text-center mb-8">
      <div class="inline-flex h-12 w-12 rounded-xl bg-emerald-600 items-center justify-center text-white font-bold text-xl mb-3">IB</div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Acesse sua Conta</h1>
      <p class="text-sm text-slate-500 mt-1">Gerencie seus ativos com segurança</p>
    </div>
    <form action="./dashboard.html" method="GET" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">E-mail</label>
        <input type="email" required placeholder="seu@email.com" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-slate-900 dark:text-white focus:border-emerald-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Senha</label>
        <input type="password" required placeholder="••••••••" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-slate-900 dark:text-white focus:border-emerald-500 focus:outline-none" />
      </div>
      <button type="submit" class="w-full rounded-lg bg-emerald-600 py-3 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 transition">Entrar na Plataforma</button>
    </form>
    <div class="mt-6 text-center text-sm text-slate-500">
      Não tem uma conta? <a href="./signup.html" class="text-emerald-600 font-semibold hover:underline">Cadastre-se</a>
    </div>
  </div>
</body>
</html>
