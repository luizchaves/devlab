<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvestFlow - Entrar na Conta</title>
  <link rel="stylesheet" href="./css/tailwind.css" />
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
  <!-- Botão de Alternância de Tema -->
  <div class="absolute top-4 right-4">
    <button type="button" data-theme-toggle aria-label="Alternar tema" title="Alternar tema" class="p-2 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
      <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      <svg data-theme-icon-moon class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      <svg data-theme-icon-auto class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
    </button>
  </div>

  <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-sm">
    <div class="text-center mb-8">
      <a href="./index.html" class="inline-flex items-center justify-center mb-3 group" title="Voltar para a página inicial">
        <svg class="h-12 w-12 shadow-sm group-hover:scale-105 transition-transform" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="9" fill="url(#if-grad-em)" />
          <path d="M8.5 22.5L14.5 16.5L19 21L27.5 11.5" stroke="white" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21.5 11.5H27.5V17.5" stroke="white" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8.5 27.5C13 27.5 15 23 19 23C23 23 24.5 26.5 28 20.5" stroke="white" stroke-width="1.75" stroke-linecap="round" opacity="0.55"/>
          <defs>
            <linearGradient id="if-grad-em" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#059669" />
              <stop offset="100%" stop-color="#0d9488" />
            </linearGradient>
          </defs>
        </svg>
      </a>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Acesse o Invest<span class="text-emerald-600 dark:text-emerald-400">Flow</span></h1>
      <p class="text-sm text-slate-500 mt-1">Gerencie seus ativos e fluxo de proventos</p>
    </div>
    <form class="space-y-4" action="./dashboard.html" method="GET" novalidate>
      <p data-notice hidden class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-2.5 text-sm text-emerald-700 dark:border-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-300">Conta criada. Entre com o seu e-mail e a sua senha.</p>
      <p data-error hidden class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-2.5 text-sm text-rose-700 dark:border-rose-800 dark:bg-rose-950/40 dark:text-rose-300"></p>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">E-mail</label>
        <input type="email" name="email" required placeholder="seu@email.com" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-slate-900 dark:text-white focus:border-emerald-500 focus:outline-none" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Senha</label>
        <div class="relative">
          <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 pl-4 pr-11 py-2.5 text-slate-900 dark:text-white focus:border-emerald-500 focus:outline-none" />
          <button type="button" data-toggle-password="password" aria-label="Mostrar senha" title="Mostrar senha" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition focus:outline-none">
            <svg data-eye-open class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <svg data-eye-closed class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="w-full rounded-lg bg-emerald-600 py-3 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 transition">Entrar na Plataforma</button>
    </form>
    <div class="mt-6 text-center text-sm text-slate-500">
      Não tem uma conta? <a href="./signup.html" class="text-emerald-600 font-semibold hover:underline">Cadastre-se</a>
    </div>
    <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 text-center">
      <a href="./index.html" class="text-xs text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition">← Voltar para a página inicial</a>
    </div>
  </div>
</body>
</html>
