<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvestFlow - Origem do Patrimônio</title>
  <link rel="stylesheet" href="../css/tailwind.css" />
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Topbar -->
  <header class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900 sticky top-0 z-40" data-navbar></header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-2 border-b border-slate-200 dark:border-slate-800">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Onde está o patrimônio</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400">A área de cada bloco é o valor atual custodiado ali.</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Agrupar por:</span>
        <div data-dimension-group class="inline-flex rounded-xl border border-slate-200 dark:border-slate-700 p-1 bg-slate-100 dark:bg-slate-800 text-xs font-medium">
          <button type="button" data-dimension="broker" class="px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm font-semibold transition">Corretora</button>
          <button type="button" data-dimension="category" class="px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">Categoria</button>
          <button type="button" data-dimension="issuer" class="px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">Emissor / gestor</button>
        </div>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm p-6">
      <div data-treemap class="w-full"></div>
      <p data-empty hidden class="py-8 text-center text-sm text-slate-500">Cadastre ativos com cotação para ver a distribuição.</p>
      <ul data-legend class="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-2 text-sm"></ul>
    </div>
  </main>
  <script type="module" src="../src/pages/origins.js"></script>
</body>
</html>
