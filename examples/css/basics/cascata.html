<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Cascata CSS</title>
    <link rel="stylesheet" href="css/cascata.css" />
  </head>
  <body>
    <p>Este parágrafo herda a fonte definida no body.</p>
    <p class="aviso destaque">Este parágrafo mostra a regra que aparece por último.</p>
    <p id="mensagem" class="aviso">Este parágrafo recebe a regra de ID.</p>
    <p id="urgente" class="aviso" style="color: #dc2626;">
      Este parágrafo recebe estilo inline.
    </p>
    <p class="prioridade" style="color: #dc2626;">
      Este parágrafo mostra uma declaração com !important.
    </p>
  </body>
</html>
