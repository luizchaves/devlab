<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grid responsivo com Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container py-4">
      <div class="row g-3 mb-3">
        <section class="col-8">
          <div class="p-3 border rounded bg-light">8 colunas</div>
        </section>

        <aside class="col-4">
          <div class="p-3 border rounded bg-light">4 colunas</div>
        </aside>
      </div>

      <div class="row g-3">
        <section class="col-12 col-md-8">
          <div class="p-3 border rounded bg-light">12 no celular, 8 no desktop</div>
        </section>

        <aside class="col-12 col-md-4">
          <div class="p-3 border rounded bg-light">12 no celular, 4 no desktop</div>
        </aside>
      </div>
    </main>
  </body>
</html>
