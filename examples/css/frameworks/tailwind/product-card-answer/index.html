<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Card de produto com Tailwind CSS</title>
  </head>
  <body class="bg-neutral-100 text-neutral-950">
    <main class="mx-auto max-w-4xl px-4 py-10">
      <article class="grid overflow-hidden rounded-xl bg-white shadow-sm md:grid-cols-[0.9fr_1.1fr]">
        <div class="bg-neutral-900 p-8 text-white">
          <p class="text-sm font-semibold uppercase tracking-wide text-lime-300">Novo</p>
          <h1 class="mt-3 text-3xl font-bold">PingWatch Pro</h1>
          <p class="mt-4 text-sm leading-6 text-neutral-300">
            Plano para equipes que precisam acompanhar APIs, sites e páginas de
            status com alertas rápidos.
          </p>
        </div>

        <div class="p-8">
          <p class="text-sm font-medium text-neutral-500">A partir de</p>
          <p class="mt-1 text-4xl font-bold">R$ 49/mês</p>
          <ul class="mt-6 space-y-3 text-sm text-neutral-700">
            <li>Monitoramento ilimitado de endpoints</li>
            <li>Alertas por e-mail</li>
            <li>Histórico de incidentes</li>
          </ul>
          <button class="mt-7 rounded-md bg-lime-400 px-4 py-2 text-sm font-semibold text-neutral-950 hover:bg-lime-300">
            Assinar plano
          </button>
        </div>
      </article>
    </main>
  </body>
</html>
