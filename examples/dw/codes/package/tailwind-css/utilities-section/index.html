<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Utilitários com Tailwind CSS</title>
  </head>
  <body class="bg-zinc-100 text-zinc-950">
    <main class="mx-auto max-w-4xl px-4 py-10">
      <section class="rounded-lg border border-zinc-200 bg-white p-6 shadow-sm">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-wide text-emerald-700">
              Status
            </p>
            <h1 class="mt-1 text-2xl font-bold">API de pagamentos estável</h1>
            <p class="mt-2 max-w-xl text-sm leading-6 text-zinc-600">
              As classes definem espaçamento, cor, borda, sombra, tipografia,
              flexbox e responsividade sem criar uma classe CSS própria.
            </p>
          </div>

          <button class="rounded-md bg-zinc-950 px-4 py-2 text-sm font-semibold text-white hover:bg-zinc-800">
            Abrir painel
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
