<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabela com Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container py-4">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Preço</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Teclado</td>
            <td>Periférico</td>
            <td>R$ 120,00</td>
          </tr>
          <tr>
            <td>Monitor</td>
            <td>Tela</td>
            <td>R$ 900,00</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
