<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitor App — Entrar</title>
    <link rel="stylesheet" href="css/tailwind.css" />
  </head>
  <body class="min-h-screen">
    <main class="mx-auto max-w-md px-4 py-10">
      <div class="card p-6">
        <div class="flex items-center gap-2 font-bold text-slate-900">
          <span class="status-dot status-online"></span>
          Monitor App
        </div>
        <h1 class="mt-4 text-2xl font-bold text-slate-900">Entrar</h1>
        <p class="mt-2 text-sm text-slate-500">
          Acesse para acompanhar os hosts que você cadastrou.
        </p>

        <form class="mt-6 grid gap-4">
          <label class="field">
            <span class="text-sm font-medium text-slate-600">E-mail</span>
            <input class="input" type="email" name="email" placeholder="voce@exemplo.com" />
          </label>
          <label class="field">
            <span class="text-sm font-medium text-slate-600">Senha</span>
            <input class="input" type="password" name="password" placeholder="••••••••" />
          </label>
          <button class="btn btn-dark" type="button">Entrar</button>
        </form>

        <p class="mt-6 text-sm text-slate-500">
          Ainda não tem conta? <a href="signup.html" class="font-semibold text-slate-900">Criar conta</a>
        </p>
      </div>
    </main>
  </body>
</html>
