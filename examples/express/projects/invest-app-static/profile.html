<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvestApp | Perfil</title>
    <link rel="stylesheet" href="css/tailwind.css" />
  </head>
  <body>
    <header class="border border-slate-200 bg-white">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-6">
        <a class="flex items-center gap-3 font-bold text-slate-900" href="index.html">
          <span class="rounded bg-teal-600 px-3 py-2 text-white">IA</span>
          InvestApp
        </a>
        <nav class="hidden md-flex items-center gap-4 text-sm font-medium text-slate-600">
          <a href="index.html">Investimentos</a>
          <a href="profile.html">Perfil</a>
          <a href="signin.html">Sair</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-10">
      <section class="grid gap-8 md-grid-cols-2">
        <article class="card p-6">
          <div class="flex items-center gap-4">
            <img class="avatar" src="public/imgs/profile/avatar.png" alt="Avatar de Maria Souza" />
            <div>
              <h1 class="text-3xl">Maria Souza</h1>
              <p class="mt-2 text-sm text-slate-500">maria@email.com</p>
            </div>
          </div>

          <form class="mt-8 grid gap-4">
            <label class="field">
              <span class="text-sm font-semibold">Nome</span>
              <input class="input" type="text" name="name" value="Maria Souza" />
            </label>
            <label class="field">
              <span class="text-sm font-semibold">E-mail</span>
              <input class="input" type="email" name="email" value="maria@email.com" />
            </label>
            <button class="btn btn-primary" type="button">Atualizar perfil</button>
          </form>
        </article>

        <article class="card p-6">
          <h2 class="text-2xl">Avatar</h2>
          <p class="mt-2 text-sm text-slate-500">
            Esta área já define a experiência visual do upload. A integração com `FormData`
            entra na etapa de upload.
          </p>

          <div class="mt-6 file-drop">
            <p class="font-semibold">Solte uma imagem aqui</p>
            <p class="mt-2 text-sm text-slate-500">PNG, JPG ou GIF até 2 MB</p>
            <button class="mt-6 btn btn-soft" type="button">Selecionar arquivo</button>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
