# O MonitorApp sobe dois servicos porque tem duas origens: a API em Node e o
# front ja compilado, servido por um Nginx que faz o papel do proxy do Vite.
services:
  api:
    build: ./back
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
      JWT_SECRET: change-me-in-production
      MONITOR_ENABLED: "true"
      MONITOR_INTERVAL: "60"
    volumes:
      - monitor-db:/app/data

  front:
    build: ./front
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  monitor-db:
