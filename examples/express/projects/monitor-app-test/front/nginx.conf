server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Em producao o Nginx assume o papel que o Vite tinha em desenvolvimento:
  # tudo sob /api vai para o servico da API, e o navegador enxerga uma origem.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # SSE precisa de conexao aberta e sem buffer.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
