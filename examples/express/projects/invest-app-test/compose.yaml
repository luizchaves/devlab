services:
  investapp:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
      JWT_SECRET: change-me-in-production
      STORAGE_TYPE: local
      EMAIL_HOST: ""
      EMAIL_PORT: "587"
      EMAIL_SECURE: "false"
    volumes:
      - investapp-db:/app/data
      - investapp-profile-images:/app/public/imgs/profile

volumes:
  investapp-db:
  investapp-profile-images:
