<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo HTTP entre cliente e servidor</title>
  <desc id="desc">Diagrama mostrando navegador cliente enviando uma requisicao HTTP para um servidor Web, que devolve uma resposta HTTP com HTML para o navegador renderizar a pagina.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="960" height="420" rx="24" fill="#f8fafc" />
  <rect x="28" y="28" width="904" height="364" rx="18" fill="#ffffff" stroke="#e2e8f0" />

  <g filter="url(#shadow)">
    <rect x="86" y="132" width="230" height="150" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <rect x="644" y="132" width="230" height="150" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
  </g>

  <text x="201" y="175" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">Navegador</text>
  <text x="201" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">cliente HTTP</text>
  <text x="201" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">digita URL ou clica em link</text>

  <text x="759" y="175" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d">Servidor Web</text>
  <text x="759" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">responde via HTTP</text>
  <text x="759" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">localiza recurso e monta resposta</text>

  <path d="M332 158 C430 96 528 96 626 158" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)" />
  <path d="M628 258 C530 324 432 324 334 258" fill="none" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)" />

  <rect x="386" y="72" width="190" height="56" rx="10" fill="#dbeafe" stroke="#93c5fd" />
  <text x="481" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">1. Requisicao HTTP</text>
  <text x="481" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1e40af">GET /pagina.html</text>

  <rect x="370" y="292" width="220" height="58" rx="10" fill="#dcfce7" stroke="#86efac" />
  <text x="480" y="316" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#15803d">2. Resposta HTTP</text>
  <text x="480" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#166534">200 OK + documento HTML</text>

  <line x1="201" y1="282" x2="201" y2="338" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" />
  <rect x="102" y="338" width="198" height="38" rx="9" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="201" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">3. Renderiza a pagina</text>

  <text x="480" y="39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Fluxo basico de uma pagina Web</text>
</svg>
