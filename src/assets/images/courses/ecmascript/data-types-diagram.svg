<svg viewBox="0 0 690 500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .connector-line { fill: none; stroke: #64748b; stroke-width: 2; opacity: 0.6; }
    .branch-primitive { stroke: #38bdf8; }
    .branch-object { stroke: #c084fc; }
    .node-root { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.5; }
    .text-root { fill: #ffffff; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; font-family: system-ui, sans-serif; }
    .node-category { stroke-width: 2; }
    .node-primitive { fill: rgba(56, 189, 248, 0.12); stroke: #38bdf8; }
    .node-object { fill: rgba(192, 132, 252, 0.12); stroke: #c084fc; }
    .text-category { fill: #f8fafc; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-family: system-ui, sans-serif; }
    .node-leaf { fill: rgba(30, 41, 59, 0.9); stroke: #475569; stroke-width: 1.2; }
    .text-leaf { fill: #38bdf8; font-size: 13px; font-weight: 600; font-family: monospace; dominant-baseline: central; }
  </style>

  <!-- Connectors: Root to Categories -->
  <path d="M 160 250 C 195 250, 195 110, 225 110" class="connector-line" />
  <path d="M 160 250 C 195 250, 195 350, 225 350" class="connector-line" />

  <!-- Connectors: Primitives to Leaves -->
  <path d="M 395 110 C 420 110, 420 24, 445 24" class="connector-line branch-primitive" />
  <path d="M 395 110 C 420 110, 420 52, 445 52" class="connector-line branch-primitive" />
  <path d="M 395 110 C 420 110, 420 80, 445 80" class="connector-line branch-primitive" />
  <path d="M 395 110 C 420 110, 420 108, 445 108" class="connector-line branch-primitive" />
  <path d="M 395 110 C 420 110, 420 136, 445 136" class="connector-line branch-primitive" />
  <path d="M 395 110 C 420 110, 420 164, 445 164" class="connector-line branch-primitive" />
  <path d="M 395 110 C 420 110, 420 192, 445 192" class="connector-line branch-primitive" />

  <!-- Connectors: Objects to Leaves -->
  <path d="M 395 350 C 420 350, 420 234, 445 234" class="connector-line branch-object" />
  <path d="M 395 350 C 420 350, 420 262, 445 262" class="connector-line branch-object" />
  <path d="M 395 350 C 420 350, 420 290, 445 290" class="connector-line branch-object" />
  <path d="M 395 350 C 420 350, 420 318, 445 318" class="connector-line branch-object" />
  <path d="M 395 350 C 420 350, 420 346, 445 346" class="connector-line branch-object" />
  <path d="M 395 350 C 420 350, 420 374, 445 374" class="connector-line branch-object" />
  <path d="M 395 350 C 420 350, 420 402, 445 402" class="connector-line branch-object" />
  <path d="M 395 350 C 420 350, 420 430, 445 430" class="connector-line branch-object" />
  <path d="M 395 350 C 420 350, 420 458, 445 458" class="connector-line branch-object" />

  <!-- ROOT NODE (Left Side) -->
  <g transform="translate(15, 225)">
    <rect x="0" y="0" width="145" height="50" rx="8" class="node-root" />
    <text x="72.5" y="25" class="text-root">Tipos de Dados</text>
  </g>

  <!-- CATEGORY 1: PRIMITIVES (Middle) -->
  <g transform="translate(225, 87)">
    <rect x="0" y="0" width="170" height="46" rx="8" class="node-category node-primitive" />
    <text x="85" y="23" class="text-category">Primitivos (7 tipos)</text>
  </g>

  <!-- CATEGORY 2: OBJECTS (Middle) -->
  <g transform="translate(225, 327)">
    <rect x="0" y="0" width="170" height="46" rx="8" class="node-category node-object" />
    <text x="85" y="23" class="text-category">Objetos (Referência)</text>
  </g>

  <!-- PRIMITIVE LEAVES (Right Side) -->
  <g transform="translate(445, 12)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">string</text>
  </g>
  <g transform="translate(445, 40)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">number</text>
  </g>
  <g transform="translate(445, 68)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">boolean</text>
  </g>
  <g transform="translate(445, 96)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">undefined</text>
  </g>
  <g transform="translate(445, 124)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">null</text>
  </g>
  <g transform="translate(445, 152)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">bigint</text>
  </g>
  <g transform="translate(445, 180)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">symbol</text>
  </g>

  <!-- OBJECT LEAVES (Right Side) -->
  <g transform="translate(445, 222)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">Object ({})</text>
  </g>
  <g transform="translate(445, 250)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">Array ([])</text>
  </g>
  <g transform="translate(445, 278)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">Function (fn)</text>
  </g>
  <g transform="translate(445, 306)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">Date / RegExp</text>
  </g>
  <g transform="translate(445, 334)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">Map / Set</text>
  </g>
  <g transform="translate(445, 362)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">WeakMap / WeakSet</text>
  </g>
  <g transform="translate(445, 390)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">Promise</text>
  </g>
  <g transform="translate(445, 418)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">Error</text>
  </g>
  <g transform="translate(445, 446)">
    <rect x="0" y="0" width="165" height="24" rx="4" class="node-leaf" />
    <text x="12" y="12" class="text-leaf">TypedArray / Buffer</text>
  </g>
</svg>
