name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  quality:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint e formatação
        run: pnpm run lint

      - name: Validação de tipos
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Validação de links internos
        run: pnpm run check:links
